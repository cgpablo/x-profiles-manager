<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>X Profiles Manager</title>
    <script>
      // Tamaño de la interfaz: en móvil (lado menor de la pantalla < 600 px) se ve más pequeña por defecto, porque el diseño
      // está pensado para tablet y escritorio. Se usa `zoom` (el WebView no reduce la vista con la metaetiqueta viewport:
      // solo ensancha la página y aparece scroll). Se puede cambiar en Ajustes; la elección se guarda en `uiScale`.
      (function () {
        try {
          var scale = parseFloat(localStorage.getItem('uiScale'));
          if (!(scale >= 0.5 && scale <= 1.5)) scale = Math.min(screen.width, screen.height) < 600 ? 0.8 : 1;
          if (scale !== 1) document.documentElement.style.zoom = String(scale);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
